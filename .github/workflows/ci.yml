name: CI

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Pytest Test Suite
        env:
          APP_SECRET_KEY: test-secret-key-32-chars-long-minimum!
          TELEGRAM_BOT_TOKEN: 999999:TEST_BOT_TOKEN
        run: uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Frontend Study Queue Unit Tests
        run: node tests/test_study_queue.js
