services:
  - type: web
    name: eng-tutor
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eng-db
          property: connectionString
      - key: RUN_BOT_IN_API
        value: "true"
      - key: CORS_ORIGINS
        value: "https://eng-tutor.onrender.com,https://eng-tutor-omuc.onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: nigerbbbit_bot
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: eng-db
    databaseName: eng_tutor
    user: eng_user
    region: frankfurt
    plan: free
