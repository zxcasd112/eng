[project]
name = "eng-tutor"
version = "0.1.0"
description = "AI-powered English learning backend and Telegram bot with FSRS spaced repetition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13.0",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4,<4.0.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "fsrs>=4.0.0",
    "greenlet>=3.1.0",
    "httpx>=0.27.0",
    "openai>=1.55.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection requires calls in argument defaults
"app/api/**" = ["B008"]
